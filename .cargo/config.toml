[profile.dev]
# Full file/line backtraces, no per-variable debug info. ~20-30% faster
# builds and much faster macOS link. Need lldb locals? Override per-shell:
# CARGO_PROFILE_DEV_DEBUG=2
debug = "line-tables-only"

# audiopus_sys builds vendored opus through CMake. In dev/test builds on
# Windows, CMake's Debug config appends /MDd after the /MD cmake-rs passes,
# so the opus objects want the debug CRT while the rest of the link uses the
# release CRT -> LNK2019 __imp__CrtDbgReportW. Release settings here make
# cmake-rs select the Release config, so the CRTs agree. We never debug into
# opus internals, so nothing is lost.
[profile.dev.package.audiopus_sys]
opt-level = 3
debug = false

[env]
# CMake 4 (pinned by hermit) removed compat with projects declaring
# cmake_minimum_required < 3.5; audiopus_sys's vendored opus declares 3.1.
# Same workaround CI uses. A value already set in the environment wins.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
